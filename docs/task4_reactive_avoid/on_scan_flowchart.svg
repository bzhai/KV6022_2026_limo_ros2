<svg xmlns="http://www.w3.org/2000/svg" width="680" height="790" viewBox="0 0 680 790" role="img"><title>on_scan decision flowchart</title>
<style>
.t{font:14px sans-serif;fill:#2C2C2A}.ts{font:12px sans-serif;fill:#5F5E5A}.th{font:500 14px sans-serif;fill:#2C2C2A}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}.leader{stroke:#888780;stroke-width:.5;stroke-dasharray:3 3;fill:none}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th{fill:#633806}.c-amber>.ts{fill:#854F0B}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="790" fill="#ffffff"/>
<g class="c-gray"><rect x="140" y="40" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="260" y="60" text-anchor="middle" dominant-baseline="central">Scan arrives</text><text class="ts" x="260" y="80" text-anchor="middle" dominant-baseline="central">nearest range per sector</text></g>
<line x1="260" y1="96" x2="260" y2="128" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="160" y="130" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" x="260" y="152" text-anchor="middle" dominant-baseline="central">Front reading usable?</text></g>
<line x1="360" y1="152" x2="438" y2="152" class="arr" marker-end="url(#arrow)"/><text class="ts" x="399" y="144" text-anchor="middle">no</text>
<g class="c-teal"><rect x="440" y="124" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="540" y="142" text-anchor="middle" dominant-baseline="central">Hold still</text><text class="ts" x="540" y="162" text-anchor="middle" dominant-baseline="central">publish 0, 0 and return</text></g>
<line x1="260" y1="174" x2="260" y2="210" class="arr" marker-end="url(#arrow)"/><text class="ts" x="270" y="196">yes</text>
<g class="c-gray"><rect x="160" y="212" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" x="260" y="234" text-anchor="middle" dominant-baseline="central">Missing side → 0 m</text></g>
<line x1="260" y1="256" x2="260" y2="296" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="140" y="298" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="260" y="316" text-anchor="middle" dominant-baseline="central">Front blocked?</text><text class="ts" x="260" y="336" text-anchor="middle" dominant-baseline="central">d_f &lt; d_s (+δ if avoiding)</text></g>
<line x1="380" y1="326" x2="438" y2="326" class="arr" marker-end="url(#arrow)"/><text class="ts" x="409" y="318" text-anchor="middle">no</text>
<g class="c-teal"><rect x="440" y="298" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="540" y="316" text-anchor="middle" dominant-baseline="central">Cruise</text><text class="ts" x="540" y="336" text-anchor="middle" dominant-baseline="central">reset latch, v = ramp</text></g>
<line x1="260" y1="354" x2="260" y2="392" class="arr" marker-end="url(#arrow)"/><text class="ts" x="270" y="377">yes</text>
<g class="c-amber"><rect x="160" y="394" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" x="260" y="416" text-anchor="middle" dominant-baseline="central">Already avoiding?</text></g>
<line x1="360" y1="416" x2="438" y2="416" class="arr" marker-end="url(#arrow)"/><text class="ts" x="399" y="408" text-anchor="middle">no</text>
<g class="c-gray"><rect x="440" y="394" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="540" y="412" text-anchor="middle" dominant-baseline="central">Latch decision</text><text class="ts" x="540" y="432" text-anchor="middle" dominant-baseline="central">set avoiding, pick sign</text></g>
<path d="M540 450 L540 518 L382 518" class="arr" marker-end="url(#arrow)"/>
<line x1="260" y1="438" x2="260" y2="488" class="arr" marker-end="url(#arrow)"/><text class="ts" x="270" y="466">yes</text>
<g class="c-amber"><rect x="140" y="490" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="260" y="508" text-anchor="middle" dominant-baseline="central">Both sides shut?</text><text class="ts" x="260" y="528" text-anchor="middle" dominant-baseline="central">d_l and d_r &lt; d_side</text></g>
<path d="M200 546 L200 572 L140 572 L140 598" class="arr" marker-end="url(#arrow)"/><text class="ts" x="150" y="590">yes</text>
<path d="M320 546 L320 572 L380 572 L380 598" class="arr" marker-end="url(#arrow)"/><text class="ts" x="390" y="590">no</text>
<g class="c-teal"><rect x="40" y="600" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="140" y="618" text-anchor="middle" dominant-baseline="central">Dead end</text><text class="ts" x="140" y="638" text-anchor="middle" dominant-baseline="central">v = 0, ω = ±ω_max</text></g>
<g class="c-teal"><rect x="280" y="600" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="380" y="618" text-anchor="middle" dominant-baseline="central">Avoid</text><text class="ts" x="380" y="638" text-anchor="middle" dominant-baseline="central">v = creep, ω ∝ asymmetry</text></g>
<path d="M140 656 L140 680 L220 680 L220 698" class="arr" marker-end="url(#arrow)"/>
<path d="M380 656 L380 680 L300 680 L300 698" class="arr" marker-end="url(#arrow)"/>
<path d="M640 326 L656 326 L656 722 L382 722" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="140" y="700" width="240" height="44" rx="8" stroke-width="0.5"/><text class="th" x="260" y="722" text-anchor="middle" dominant-baseline="central">Publish Twist on /cmd_vel</text></g>
<text class="ts" x="340" y="772" text-anchor="middle">Amber = decision · Teal = motion state · Gray = processing step</text>
</svg>
